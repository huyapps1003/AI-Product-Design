*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--text);font:400 14px/1.57 "Public Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px}

.proto{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--divider);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.proto-title{font-weight:700;font-size:13px;margin-right:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proto-title small{font-weight:500;color:var(--text2)}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--neutral);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--text);box-shadow:var(--z1)}

.stage{padding:24px 16px 40px}
.device{margin:0 auto;background:var(--bg);border-radius:16px;overflow:hidden;box-shadow:var(--card);max-width:1440px}
.stage.mobile .device{max-width:390px;height:800px;border-radius:36px;border:10px solid #161C24;display:flex;flex-direction:column}
.stage.mobile .app{flex:1;overflow:auto}

.app{container-type:inline-size;background:var(--bg);min-height:720px}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{border-right:1px dashed var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:4px 8px 20px}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px}
.nav-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);padding:12px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;color:var(--text2);text-decoration:none;font-weight:500;min-height:44px}
.nav a.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav svg{width:22px;height:22px;flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--divider);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);z-index:5}
.scope{display:flex;align-items:center;gap:6px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500;background:transparent}
.scope span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope .sep{color:var(--text3)}
.top .grow{flex:1}
.me{display:flex;align-items:center;gap:10px}
.me .who{line-height:1.25;text-align:right}
.me .who b{display:block;font-size:13px}
.me .who small{color:var(--text2);font-size:12px;white-space:nowrap}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;width:36px;height:36px;font-size:13px;background:var(--secondary-soft);color:var(--secondary)}

.content{padding:24px 32px 48px;width:100%;max-width:1280px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{margin:0;font-size:24px;font-weight:700;line-height:1.3}
.page-h p{margin:2px 0 0;color:var(--text2)}
.page-h .grow{flex:1}
.show-dict .page-h + .dict{margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.stat{background:var(--paper);border-radius:16px;box-shadow:var(--card);padding:16px 20px}
.stat .n{font-size:24px;font-weight:700;line-height:1.3}
.stat .t{font-size:13px;color:var(--text2)}
.stat .cap{font-size:11px;color:var(--text3);margin-top:4px}

.qtabs{display:flex;gap:24px;border-bottom:1px solid var(--divider);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.qtabs button{border:0;background:transparent;padding:12px 0;font-weight:600;color:var(--text2);white-space:nowrap;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.qtabs button[aria-pressed="true"]{color:var(--text);border-color:var(--text)}
.qtabs .cnt{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--neutral);color:var(--text2)}

.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
.card{background:var(--paper);border-radius:16px;box-shadow:var(--card)}
.card-h{display:flex;align-items:center;gap:8px;padding:20px 24px 0;flex-wrap:wrap}
.card-h h2{margin:0;font-size:17px;font-weight:700;margin-right:auto}
.card-b{padding:16px 24px 24px}

.treebox{position:sticky;top:80px;max-height:calc(100vh - 120px);display:flex;flex-direction:column}
.stage.mobile .treebox{position:static;max-height:none}
.search{margin:16px 16px 8px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:44px}
.search svg{width:20px;height:20px;color:var(--text3);flex:none}
.search input{border:0;outline:0;background:transparent;font:inherit;color:var(--text);flex:1;min-width:0}
.tree{list-style:none;margin:0;padding:4px 8px 16px;overflow:auto}
.tree ul{list-style:none;margin:0;padding:0 0 0 16px;border-left:1px dashed var(--line);margin-left:15px}
.node{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:8px;min-height:40px}
.node:hover{background:var(--neutral)}
.node[aria-current="true"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.node .tw{width:20px;height:20px;display:grid;place-items:center;color:var(--text3);flex:none;border-radius:4px}
.node .tw svg{width:16px;height:16px;transition:transform .15s}
.node[aria-expanded="true"] .tw svg{transform:rotate(90deg)}
.node .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .ct{font-size:11px;font-weight:700;color:var(--text3)}
.lvl{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--text3);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:16px;flex:none}
.mark{width:8px;height:8px;border-radius:50%;background:var(--warning-line);flex:none}

.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;line-height:1;white-space:nowrap}
.c-success{background:var(--success-soft);color:var(--success)}
.c-warning{background:var(--warning-soft);color:var(--warning)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-default{background:var(--neutral);color:var(--text2)}
.c-pending{background:transparent;border:1px solid var(--warning-line);color:var(--warning);font-weight:600}
.c-source{background:var(--info-soft);color:var(--info);font-weight:600}
.chip svg{width:13px;height:13px}

.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:14px;white-space:nowrap}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}

.dh{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:20px 24px;border-bottom:1px solid var(--divider)}
.dh .ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft2);color:var(--primary-dark);font-weight:700;flex:none}
.dh .id{flex:1;min-width:200px}
.dh h2{margin:0;font-size:20px;line-height:1.3}
.crumb{color:var(--text2);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:2px}
.crumb button{border:0;background:transparent;padding:0;color:var(--text2);text-decoration:underline;text-underline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.sec{padding:20px 24px;border-bottom:1px solid var(--divider)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 12px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec h3 .grow{flex:1}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.f{min-width:0}
.f .l{font-size:12px;color:var(--text2)}
.f .v{font-weight:500;margin-top:2px;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.f .v.muted{color:var(--text3);font-weight:400}
.dict{display:none;margin-top:4px;font-size:11px;color:var(--dict);background:var(--dict-soft);border-radius:6px;padding:3px 6px;gap:6px;flex-wrap:wrap;align-items:center}
.show-dict .dict{display:flex}
.dict code{font-size:11px;color:inherit;font-weight:700}
.st{font-weight:700;border-radius:4px;padding:0 4px}
.st-known{background:var(--success-soft);color:var(--success)}
.st-confirmed{background:var(--success-soft);color:var(--success)}
.st-assumed{background:var(--info-soft);color:var(--info)}
.st-open{background:var(--warning-soft);color:var(--warning)}

.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--divider);flex-wrap:wrap;width:100%;background:transparent;text-align:left}
button.row:hover{background:var(--neutral)}
.row .t{flex:1;min-width:160px}
.row .t b{display:block;font-weight:600}
.row .t small{color:var(--text2);font-size:12px}

.inh{display:flex;flex-direction:column;gap:2px}
.inh small{color:var(--text2);font-size:12px;display:flex;gap:4px;align-items:center}
.inh small svg{width:14px;height:14px}

.pend{border:1px dashed var(--warning-line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.pend svg{width:20px;height:20px;color:var(--warning);flex:none;margin-top:1px}
.pend b{display:block}
.pend p{margin:2px 0 0;color:var(--text2);font-size:13px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:12px 14px;border-radius:10px;background:var(--info-soft);color:var(--text)}
.note svg{width:18px;height:18px;color:var(--info);flex:none;margin-top:1px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:600;color:var(--text2);background:var(--neutral);padding:12px 16px;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px dashed var(--divider);vertical-align:middle}
.tablewrap{overflow-x:auto}
.empty{padding:40px 20px;text-align:center;color:var(--text2)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.back{display:none}

@container (max-width:1080px){
  .shell{grid-template-columns:76px 1fr}
  .side .logo span,.nav-h,.nav a span{display:none}
  .nav a{justify-content:center}
  .content{padding:24px 20px 48px}
  .split{grid-template-columns:300px minmax(0,1fr)}
}
@container (max-width:860px){
  .split{grid-template-columns:minmax(0,1fr)}
  .treebox{position:static;max-height:none}
  .split.detail-open .treebox{display:none}
  .split:not(.detail-open) .detail{display:none}
  .back{display:inline-flex}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .me .who{display:none}
}
@container (max-width:640px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:0 12px;height:56px}
  .scope .hide-sm{display:none}
  .content{padding:16px 16px 48px}
  .fields{grid-template-columns:minmax(0,1fr)}
  .dh,.sec{padding:16px}
  .page-h h1{font-size:20px}
  .stat{padding:12px 14px}
  .stat .n{font-size:20px}
}
</style>

/* ---------- Build the tree (OR01) ---------- */
const nodes = {};
function add(n){ nodes[n.id]=n; if(n.parent) nodes[n.parent].children.push(n.id); return n; }
add({id:'gsg',type:'GROUP',name:'Global Schools Group',parent:null,children:[]});

DATA.brandCountries.forEach(bc=>add({id:'bc-'+bc.brand+'-'+bc.cc,type:'BRAND_COUNTRY',name:bc.display,brand:bc.brand,cc:bc.cc,country:bc.country,region:bc.cc,currency:bc.currency,regulator:bc.regulator,parent:'b-'+bc.brand,children:[]}));
DATA.campuses.forEach((c,i)=>{
  const bc='bc-'+c.brand+'-'+c.cc;
  add({id:'c-'+i,type:'CAMPUS',name:c.name,brand:c.brand,cc:c.cc,city:c.city,code:c.code||null,flags:c.flags||[],sample:c.sample||null,unlisted:!!c.unlisted,parent:bc,children:[],segments:c.segments||null,tz:c.tz||null,stages:c.stages||null,ay:c.ay||null,note:c.note||null});
});
Object.values(nodes).filter(n=>n.type==='CAMPUS'&&n.segments).forEach(n=>{
  n.segments.forEach((s,j)=>add({id:n.id+'-s'+j,type:'SEGMENT',name:s,parent:n.id,children:[],campus:n.id}));
});
const TYPE_LABEL={GROUP:'Group',BRAND:'Brand',BRAND_COUNTRY:'Brand-country',CAMPUS:'Campus',SEGMENT:'Segment'};
const LVL={GROUP:'GRP',BRAND:'BRD',BRAND_COUNTRY:'B·C',CAMPUS:'CMP',SEGMENT:'SEG'};
function path(id){ const p=[]; let n=nodes[id]; while(n){p.unshift(n); n=n.parent?nodes[n.parent]:null;} return p; }
function countCampuses(id){ const n=nodes[id]; if(n.type==='CAMPUS') return (n.unlisted||!inScope(id))?0:1; return n.children.reduce((a,c)=>a+countCampuses(c),0); }
function brandName(code){ return nodes['b-'+code].name; }
function regionOf(cc){ return DATA.regions.find(r=>r.cc===cc); }

/* ---------- State ---------- */
const VIEWERS={
  ga:{name:'Daniel Ong',role:'Global Admin · GSG',initials:'DO',scope:'gsg',canEdit:true},
  cl:{name:'Dr Anita Rao',role:'Campus Leader · SMART Campus',initials:'AR',scope:null,canEdit:false}

VIEWERS.cl.scope = Object.values(nodes).find(n=>n.sample==='SG-PGL').id;
let state={viewer:'ga',tab:'tree',selected:'gsg',open:new Set(['gsg','b-GIIS','bc-GIIS-SG']),q:'',detailOpen:false};

function visible(id){ // campus leader sees own path and below only
  const v=VIEWERS[state.viewer]; if(v.scope==='gsg') return true;
  const scopePath=path(v.scope).map(n=>n.id);
  if(scopePath.includes(id)) return true;
  return path(id).some(n=>n.id===v.scope);
}
function inScope(id){ const v=VIEWERS[state.viewer]; return v.scope==='gsg' || path(id).some(n=>n.id===v.scope); }

/* ---------- Dictionary annotation ---------- */
function D(ref,status,basis){
  const cls={Known:'st-known',Confirmed:'st-confirmed',Assumed:'st-assumed',Open:'st-open'}[status];
  return `<span class="dict"><code>${esc(ref)}</code><span class="st ${cls}">${status}</span>${basis?`<span>${esc(basis)}</span>`:''}</span>`;
}
function F(label,value,ref,status,basis,muted){
  return `<div class="f"><div class="l">${esc(label)}</div><div class="v${muted?' muted':''}">${value}</div>${D(ref,status,basis)}</div>`;
}
const P = (oq,text) => `<span class="chip c-pending">${ICON.clock}${esc(text||'Pending')} · ${oq}</span>`;

/* ---------- Render ---------- */
function render(){
  const v=VIEWERS[state.viewer];
  document.getElementById('meName').textContent=v.name;
  document.getElementById('meRole').textContent=v.role;
  document.getElementById('meAv').textContent=v.initials;
  const sp=path(v.scope);
  document.getElementById('scopeBtn').innerHTML = sp.map((n,i)=>`<span class="${i>0&&i<sp.length-1?'hide-sm':''}">${esc(i===0?'GSG':n.type==='BRAND'?n.code:n.type==='BRAND_COUNTRY'?n.country:n.name)}</span>`).join('<span class="sep">›</span>');
  const c=document.getElementById('content');
  const listed=Object.values(nodes).filter(n=>n.type==='CAMPUS'&&!n.unlisted);
  const scopedCampuses=listed.filter(n=>inScope(n.id)).length;
  c.innerHTML = `
    <div class="page-h"><div><h1>Organisation</h1><p>Scope tree, data regions and operating entities${v.scope==='gsg'?' for every GSG brand':' for your campus'}</p></div><div class="grow"></div>
      ${v.canEdit?`<button class="btn btn-primary" disabled title="Who creates campuses is open (OQ-58)">+ New campus</button>`:''}</div>
    ${D('OBJ-13 · OR01–OR06','Confirmed','Tree DL-40 · global layer DL-39 · source: globalschools.com/campus, 9 Nov 2026')}
    <div class="stats">
      <div class="stat"><div class="n">${v.scope==='gsg'?DATA.brands.length:1}</div><div class="t">Brands</div><div class="cap">OR02</div></div>
      <div class="stat"><div class="n">${v.scope==='gsg'?DATA.brandCountries.length:1}</div><div class="t">Brand-countries</div><div class="cap">OR03</div></div>
      <div class="stat"><div class="n">${scopedCampuses}</div><div class="t">Campuses</div><div class="cap">OR04 · ${v.scope==='gsg'?'+1 not on public list (OQ-57)':'your campus'}</div></div>
      <div class="stat"><div class="n">${v.scope==='gsg'?DATA.regions.length:1}</div><div class="t">Data regions</div><div class="cap">OR06 · ${v.scope==='gsg'?'2 defined, 8 pending OQ-21':'Singapore'}</div></div>
    </div>
    <div class="qtabs" role="tablist">
      ${tabBtn('tree','Scope tree',scopedCampuses)}
      ${tabBtn('regions','Data regions',v.scope==='gsg'?DATA.regions.length:1)}
      ${tabBtn('entities','Operating entities',0)}
    </div>
    <div id="tabBody"></div>`;
  c.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();});
  const tb=document.getElementById('tabBody');
  if(state.tab==='tree') renderTree(tb); else if(state.tab==='regions') renderRegions(tb); else renderEntities(tb);
}
function tabBtn(id,label,n){ return `<button role="tab" data-tab="${id}" aria-pressed="${state.tab===id}">${label}<span class="cnt">${n}</span></button>`; }

function renderTree(tb){
  tb.innerHTML = `<div class="split ${state.detailOpen?'detail-open':''}">
    <section class="card treebox" aria-label="Scope tree">
      <label class="search">${ICON.search}<input id="q" type="search" placeholder="Search brand, country or campus" value="${esc(state.q)}" aria-label="Search the tree"></label>
      <ul class="tree" id="tree" role="tree"></ul>
    </section>
    <section class="card detail" id="detail" aria-live="polite"></section>
  </div>`;
  const q=document.getElementById('q');
  q.oninput=()=>{state.q=q.value;drawTree();};
  drawTree(); drawDetail();
}
function matches(id,q){ const n=nodes[id]; if(!q) return true;
  const hay=(n.name+' '+(n.city||'')+' '+(n.code||'')+' '+(n.country||'')).toLowerCase();
  return hay.includes(q) || n.children.some(c=>matches(c,q)); }
function drawTree(){
  const q=state.q.trim().toLowerCase();
  const el=document.getElementById('tree');
  function li(id,depth){
    const n=nodes[id]; if(!visible(id)||!matches(id,q)) return '';
    const kids=n.children.filter(c=>visible(c)&&matches(c,q));
    const open=q?true:state.open.has(id);
    const flag=(n.flags&&n.flags.length)||n.unlisted;
    const ct=n.type==='CAMPUS'||n.type==='SEGMENT'?'':`<span class="ct">${countCampuses(id)}</span>`;
    return `<li role="treeitem" aria-expanded="${kids.length?open:''}">
      <button class="node" data-id="${id}" aria-current="${state.selected===id}" ${kids.length?`aria-expanded="${open}"`:''}>
        <span class="tw" data-tw="${id}">${kids.length?ICON.chev:''}</span>
        <span class="lvl">${LVL[n.type]}</span><span class="nm">${esc(n.type==='BRAND_COUNTRY'?n.country:n.name)}</span>${flag?'<span class="mark" title="Has an open question"></span>':''}${ct}
      </button>
      ${kids.length&&open?`<ul role="group">${kids.map(k=>li(k,depth+1)).join('')}</ul>`:''}
    </li>`;
  }
  const root=VIEWERS[state.viewer].scope==='gsg'?'gsg':'gsg';
  const html=li(root,0);
  el.innerHTML = html || `<li class="empty"><b>No match</b>Try a brand, country or city.</li>`;
  el.querySelectorAll('.node').forEach(b=>b.onclick=e=>{
    const id=b.dataset.id;
    if(e.target.closest('[data-tw]') && nodes[id].children.length){ state.open.has(id)?state.open.delete(id):state.open.add(id); drawTree(); return; }
    state.selected=id; state.open.add(id); state.detailOpen=true;
    document.querySelector('.split').classList.add('detail-open');
    drawTree(); drawDetail();
  });
}
function select(id){ state.selected=id; path(id).forEach(n=>state.open.add(n.id)); state.detailOpen=true; renderTree(document.getElementById('tabBody')); }

function header(n,chips,acts){
  const p=path(n.id);
  return `<div class="dh">
    <button class="btn back" id="backBtn">${ICON.back}Tree</button>
    <div class="ico">${LVL[n.type]}</div>
    <div class="id"><h2>${esc(n.type==='BRAND_COUNTRY'?n.name:n.name)}</h2>
      <div class="crumb">${p.slice(0,-1).map(x=>`<button data-go="${x.id}">${esc(x.type==='GROUP'?'GSG':x.type==='BRAND'?x.code:x.type==='BRAND_COUNTRY'?x.country:x.name)}</button><span>›</span>`).join('')}<span>${TYPE_LABEL[n.type]}</span></div>
      <div class="chips">${chips}</div>
    </div>
    <div class="acts">${acts||''}</div>
  </div>`;
}
function wire(el){
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(b.dataset.go));
  const bb=el.querySelector('#backBtn'); if(bb) bb.onclick=()=>{state.detailOpen=false;document.querySelector('.split').classList.remove('detail-open');};
}
function childRows(n,sub){
  const kids=n.children.filter(visible);
  if(!kids.length) return `<div class="empty"><b>Nothing below this node</b></div>`;
  return `<div class="rows">${kids.map(id=>{const k=nodes[id];
    return `<button class="row" data-go="${id}"><span class="lvl">${LVL[k.type]}</span><span class="t"><b>${esc(k.type==='BRAND_COUNTRY'?k.name:k.name)}</b><small>${esc(sub(k))}</small></span>${k.unlisted?'<span class="chip c-pending">Not on public list · OQ-57</span>':k.type==='CAMPUS'?'<span class="chip c-success">Active</span>':''}</button>`;}).join('')}</div>`;
}

function drawDetail(){
  const el=document.getElementById('detail'); const n=nodes[state.selected]; const v=VIEWERS[state.viewer];
  const edit=v.canEdit;
  let h='';
  if(n.type==='GROUP'){
    h+=header(n,`<span class="chip c-success">Active</span><span class="chip c-default">${DATA.brands.length} brands · 10 countries</span>`);
    h+=`<div class="sec"><h3>Group</h3><div class="fields">
      ${F('Name','Global Schools Group','OR01.display_name','Known','DL-22')}
      ${F('Level','Group (root, one only)','OR01.node_type','Confirmed','DL-40')}
      ${F('Path','<code>gsg</code>','OR01.path','Assumed','DL-48')}
      ${F('Regions above Brand-country',P('OQ-59','Not modelled'),'OR01','Open','No level between Group and Brand')}
    </div></div>
    <div class="sec"><h3>Brands</h3>${childRows(n,k=>`${countCampuses(k.id)} campuses · ${k.children.length} ${k.children.length===1?'country':'countries'}`)}</div>
    <div class="sec"><div class="pend">${ICON.clock}<div><b>Campuses named elsewhere but not on the public list</b><p>GIIS East Coast (Singapore), GIIS Bangkok (Thailand) and OWIS Suntec (Singapore). East Coast is in the tree because the sample data uses it; the others are not shown until GSG confirms they operate (OQ-57).</p></div></div></div>`;
  }
  else if(n.type==='BRAND'){
    h+=header(n,`<span class="chip c-success">Active</span><span class="chip c-default">${countCampuses(n.id)} campuses</span>`, edit?`<button class="btn" disabled title="Owner open (OQ-58)">Edit brand</button>`:'');
    h+=`<div class="sec"><h3>Brand</h3><div class="fields">
      ${F('Display name',esc(n.name),'OR02.display_name','Known','Public campus list; final form OQ-56')}
      ${F('Brand code',`<code>${esc(n.code)}</code> <span class="chip c-pending">Placeholder · OQ-55</span>`,'OR02.brand_code','Open','OQ-55')}
      ${F('Legal name',P('OQ-56'),'OR02.legal_name','Open','Not the operating entity',true)}
      ${F('Logo and colours',P('OQ-26'),'OR02.brand_assets_ref','Open','How brand shows in shared shells',true)}
    </div></div>
    <div class="sec"><h3>Brand-countries</h3>${childRows(n,k=>`${countCampuses(k.id)} campuses · ${regionOf(k.cc).name}`)}</div>`;
  }
  else if(n.type==='BRAND_COUNTRY'){
    const r=regionOf(n.cc); const reg=n.regulator;
    h+=header(n,`<span class="chip c-success">Active</span><span class="chip c-source">${esc(r.name)}</span>`, edit?`<button class="btn" disabled title="Owner open (OQ-58)">Edit</button>`:'');
    const others=DATA.brandCountries.filter(b=>b.cc===n.cc&&b.brand!==n.brand).map(b=>brandName(b.brand));
    h+=`<div class="sec"><h3>${esc(n.name)}</h3><div class="fields">
      ${F('Brand',esc(brandName(n.brand)),'OR01.parent_scope_node_id','Confirmed','DL-40')}
      ${F('Country',`${esc(n.country)} <code>${n.cc}</code>`,'OR03.country_code','Confirmed','One node per brand and country, DL-40')}
      ${F('Data region',`<span class="chip c-source">${esc(r.name)}</span> ${r.defined?'<span class="chip c-info">Planned</span>':P('OQ-21','Placeholder')}`,'OR03.data_region_id → OR06','Confirmed','Selected by country, never per campus (DL-39, DL-40); term DL-47')}
      ${F('Regulator pack',reg?`<code>${reg}</code>`:P('OQ-22'),'OR03.regulator_pack_code',reg?'Known':'Open',reg?'regulatory-context':'Packs exist for SG and IN only',!reg)}
      ${F('Currency',n.currency?`<code>${n.currency}</code>`:P('Fees dictionary'),'OR03.currency_code',n.currency?'Known':'Open','Arch § Tenancy',!n.currency)}
      ${F('Languages offered',P('OQ-25, OQ-53'),'OR03.languages_offered','Open','UI stays English in v1 (DL-15)',true)}
      ${F('Public holidays','Holiday calendar <span class="chip c-default">Not loaded in prototype</span>','OR03.holiday_calendar_ref','Known','Arch § Tenancy')}
    </div></div>
    ${others.length?`<div class="sec"><div class="note">${ICON.info}<div>The ${esc(r.name)} also holds ${esc(others.join(', '))}. A grant on ${esc(n.name)} never reaches them (DL-40). ${D('OR06 → OR03 1..N','Confirmed','DL-40, answers OQ-17')}</div></div></div>`:''}
    <div class="sec"><h3>Campuses</h3>${childRows(n,k=>`${k.city||''}${k.code?' · '+k.code:''}`)}</div>`;
  }
  else if(n.type==='CAMPUS'){
    const r=regionOf(n.cc); const bc=nodes[n.parent];
    const flagChips=(n.flags||[]).map(f=>{const [k,oq]=f.split(':');
      const lbl={shared_area_other_brand:'Shares area with another brand',stage_campus:'Stage campus',preschool_only:'Preschool only',adult_learners_possible:'Possible adult learners'}[k]||k;
      return oq?`<span class="chip c-pending">${esc(lbl)} · ${oq}</span>`:`<span class="chip c-default">${esc(lbl)}</span>`;}).join('');
    const status=n.unlisted?'<span class="chip c-pending">Status pending · OQ-57</span>':'<span class="chip c-success">Active</span>';
    h+=header(n,`${status}<span class="chip c-default">${esc(brandName(n.brand))}</span><span class="chip c-source">${esc(r.name)}</span>${flagChips}`,
      edit?`<button class="btn" disabled title="Owner open (OQ-58)">Edit campus</button><button class="btn" disabled title="Owner open (OQ-58)">Close campus</button>`:'<span class="chip c-default">'+ICON.lock+'Read only</span>');
    h+=`<div class="sec"><h3>Campus</h3><div class="fields">
      ${F('Campus name',esc(n.name),'OR04.campus_name','Known','Public list; always shown with brand (OR-R09)')}
      ${F('Campus code',n.code?`<code>${esc(n.code)}</code> <span class="chip c-pending">Placeholder · OQ-55</span>`:P('OQ-55','No code yet'),'OR04.campus_code','Open','Standard and owner OQ-55',!n.code)}
      ${F('Brand-country',`<button class="btn" style="height:30px;padding:0 10px;font-size:13px" data-go="${bc.id}">${esc(bc.name)}</button>`,'OR04.brand_country_node_id','Confirmed','Replaces E06 organization_id (DL-40)')}
      ${F('City',esc(n.city||'—'),'OR04.city','Known','Public list')}
      ${F('Time zone',n.tz?`<code>${esc(n.tz)}</code>`:'<span class="chip c-default">Not in sample</span>','OR04.time_zone','Known','ED E06',!n.tz)}
      ${F('Stages served',n.stages?n.stages.map(s=>`<span class="chip c-default">${esc(s.replace('_',' ').toLowerCase().replace(/^./,c=>c.toUpperCase()))}</span>`).join(''):'<span class="chip c-default">Not in sample</span>','OR04.stages_served','Assumed','DL-50; descriptive only, not Segments',!n.stages)}
      ${F('Status',status,'OR04.campus_status',n.unlisted?'Open':'Assumed',n.unlisted?'OQ-57':'DL-50: Planned, Active, Inactive, Closed')}
      ${F('Data region',`<span class="chip c-source">${esc(r.name)}</span> <small style="color:var(--text2)">from ${esc(bc.name)}</small>`,'OR06 via OR03','Confirmed','Read-only; derived from country (DL-39, DL-40)')}
      ${F('Address',P('OQ-52'),'OR04.address_ref','Open','Shared sites across brands',true)}
      ${F('First release',P('OQ-05'),'OR04.first_release','Open','Not shown until answered',true)}
    </div></div>`;
    // Operator AP-09
    h+=`<div class="sec"><h3>Operating entity <span class="grow"></span>${edit?`<button class="btn" disabled title="Owner and approver open (OQ-58)">Change operator</button>`:''}</h3>
      <div class="rows"><div class="row"><span class="t"><b>[operating entity — OQ-02]</b><small>Operator · from ${n.ay?'—':'—'} · current</small></span>${P('OQ-02')}</div></div>
      ${D('OR08 → OR07','Confirmed','Effective-dated link (DL-41); names OQ-02; partner role OQ-03; handover OQ-04')}
      <div class="note" style="margin-top:12px">${ICON.info}<div>Enrolments, employment and cases copy this entity when they are created and keep it after a handover. It is not shown as the data controller (AR-04, OQ-06), and it never appears in the scope picker (DL-41).</div></div>
    </div>`;
    // Segments
    const segs=n.children.filter(c=>nodes[c].type==='SEGMENT');
    h+=`<div class="sec"><h3>Segments</h3>${segs.length?childRows(n,k=>'Segment · school-day timings and events'):`<div class="pend">${ICON.clock}<div><b>No segment list for this campus yet</b><p>Only GIIS Noida's segments are known (Pre-Primary, Primary, Middle, Higher). Other campuses' lists are open (OQ-20).</p></div></div>`}
      ${D('OR05','Confirmed','Term DL-29; values per campus OQ-20')}</div>`;
    // Settings AP-02
    const cur=bc.currency;
    h+=`<div class="sec"><h3>Settings</h3><div class="fields">
      ${F('Currency',cur?`<span class="inh"><span><code>${cur}</code> <span class="chip c-default">${ICON.lock}Locked</span></span><small>${ICON.down}Inherited from ${esc(bc.name)}</small></span>`:P('Fees dictionary'),'OR09 · finance.currency','Known','AR-03 inherit; AP-02 indicator',!cur)}
      ${F('Academic year start',n.ay?`<span class="inh"><span>${esc(n.ay)}</span><small>Set at this campus</small></span>`:'<span class="chip c-default">Not in sample</span>','OR09 · calendar.academic_year_start','Known','Varies by campus (MC-06)',!n.ay)}
      ${F('Who may override',P('OQ-20'),'OR09.override_policy','Open','Values Assumed DL-50: Open, Locked below',true)}
    </div></div>`;
    if(n.note) h+=`<div class="sec"><div class="note">${ICON.info}<div>${esc(n.note)}</div></div></div>`;
  }
  else if(n.type==='SEGMENT'){
    const cp=nodes[n.parent];
    h+=header(n,`<span class="chip c-success">Active</span><span class="chip c-default">${esc(cp.name)}</span>`);
    h+=`<div class="sec"><h3>Segment</h3><div class="fields">
      ${F('Name',esc(n.name),'OR05.display_name','Known','GIIS Noida Almanac 2025-26')}
      ${F('Campus',esc(cp.name),'OR01.parent_scope_node_id','Confirmed','SEGMENT → CAMPUS (DL-40)')}
      ${F('Grade range',P('OQ-51'),'OR05.grade_range','Open','From the programme pack (OBJ-15)',true)}
      ${F('Grants at this level','Not allowed','OR01.node_type','Confirmed','Grants stop at Campus (DL-40); used for settings and data scope')}
    </div></div>`;
  }
  el.innerHTML=h; wire(el);
}

function renderRegions(tb){
  const v=VIEWERS[state.viewer];
  const rows=DATA.regions.filter(r=>v.scope==='gsg'||r.cc==='SG');
  tb.innerHTML=`<section class="card"><div class="card-h"><h2>Data regions</h2></div>
    <div class="card-b">${D('OBJ-13 · OR06','Confirmed','One per country (DL-39); product term "data region" DL-47 (Assumed)')}
    <p style="color:var(--text2);margin:8px 0 16px">Where each country's school data lives. A brand-country's country selects its region; campuses never choose one.</p>
    <div class="tablewrap"><table><thead><tr><th>Data region</th><th>Countries</th><th>Brand-countries</th><th>Campuses</th><th>Status</th></tr></thead><tbody>
    ${rows.map(r=>{const bcs=DATA.brandCountries.filter(b=>b.cc===r.cc);
      const camp=Object.values(nodes).filter(n=>n.type==='CAMPUS'&&!n.unlisted&&n.cc===r.cc).length;
      return `<tr><td><b>${esc(r.name)}</b></td><td><code>${r.cc}</code></td><td>${bcs.map(b=>esc(brandName(b.brand).split(' ')[0]==='Global'?'GIIS':b.brand)).join(', ')}</td><td>${camp}</td><td>${r.defined?'<span class="chip c-info">Planned</span>':P('OQ-21','Placeholder')}</td></tr>`;}).join('')}
    </tbody></table></div>
    <div class="note" style="margin-top:16px">${ICON.info}<div>Singapore and India are the two regions the architecture defines. The other eight assume one region per country until counsel answers OQ-21.</div></div>
    </div></section>`;
}
function renderEntities(tb){
  tb.innerHTML=`<section class="card"><div class="card-h"><h2>Operating entities</h2></div><div class="card-b">
    ${D('OBJ-14 · OR07, OR08','Confirmed','Structure DL-41; list OQ-02')}
    <div class="empty"><b>No operating entities recorded yet</b>Which companies operate GSG's campuses is an open question (OQ-02). Until it is answered every campus shows "[operating entity — OQ-02]".</div>
    <div class="fields" style="margin-top:8px">
      ${F('Legal name',P('OQ-02'),'OR07.legal_name','Open','Never invent a company name',true)}
      ${F('Type','Group operator, School operator, Partner, Employer','OR07.entity_type','Confirmed','DL-41')}
      ${F('Operator role on a campus','Operator, Franchisee, JV partner','OR08.operator_role','Assumed','DL-50; which campuses OQ-03')}
      ${F('Who approves a handover',P('OQ-58'),'OR08.change_case_id','Open','Effects on data OQ-04',true)}
    </div></div></section>`;
}

/* ---------- Prototype controls ---------- */
function seg(id,attr,fn){ const s=document.getElementById(id); s.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset[attr]);}); }
seg('viewerSeg','v',v=>{state.viewer=v; state.tab='tree'; state.q=''; state.detailOpen=false;
  if(v==='cl'){ select(VIEWERS.cl.scope); state.detailOpen=false; } else { state.selected='gsg'; }
  render();});
seg('dictSeg','d',d=>document.getElementById('app').classList.toggle('show-dict',d==='on'));
seg('frameSeg','f',f=>document.getElementById('stage').classList.toggle('mobile',f==='mobile'));
seg('themeSeg','t',t=>{ if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); });
render();
</script>
