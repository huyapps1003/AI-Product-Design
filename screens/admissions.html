<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admissions Prototype</title>
<!--
  Screens: SCR-AD-01 Enquiries · SCR-AD-02 Applications board · SCR-AD-03 Application detail · SCR-AD-04 Capacity and waitlist · SCR-AD-05 Admission settings
  Viewers: Lina Goh (Admissions Officer, SG-PGL) · Marcus Lee (Admissions Manager, GIIS Singapore) · Dr Anita Rao (Principal, SG-PGL) · Pooja Malhotra (Admissions Officer, IN-NOI)
  Objects: OBJ-16 Application (primary), OBJ-03 Enrolment, OBJ-10 Case (approval)
  Sample: product-truth/03-domain/samples/admissions-sample.json · today 12 Nov 2026 · synthetic
  DL: DL-56 DL-57 DL-58 DL-59 DL-60 DL-61 (Confirmed 14 Nov 2026) DL-65 DL-67 · OQ shown as pending: OQ-62 OQ-63 OQ-64 OQ-66 OQ-67 OQ-68 OQ-72
  Spec: Admissions Data Dictionary v0.1 (PR #14)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#00A76F;--primary-dark:#007867;--primary-soft:rgba(0,167,111,.08);--primary-soft2:rgba(0,167,111,.16);
  --secondary:#8E33FF;--secondary-soft:rgba(142,51,255,.08);
  --error:#B71D18;--error-soft:rgba(255,86,48,.12);
  --warning:#B76E00;--warning-soft:rgba(255,171,0,.14);--warning-line:#FFAB00;
  --info:#006C9C;--info-soft:rgba(0,184,217,.12);
  --success:#118D57;--success-soft:rgba(34,197,94,.14);
  --text:#212B36;--text2:#637381;--text3:#919EAB;
  --bg:#FFFFFF;--paper:#FFFFFF;--neutral:#F4F6F8;--canvas:#EDEFF2;
  --divider:rgba(145,158,171,.2);--line:rgba(145,158,171,.32);
  --z1:0 1px 2px rgba(145,158,171,.16);
  --card:0 0 2px 0 rgba(145,158,171,.2),0 12px 24px -4px rgba(145,158,171,.12);
  --scrim:rgba(22,28,36,.48);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#5BE49B;--primary-dark:#5BE49B;--primary-soft:rgba(91,228,155,.10);--primary-soft2:rgba(91,228,155,.18);
  --secondary:#C684FF;--secondary-soft:rgba(198,132,255,.12);
  --error:#FFAC82;--error-soft:rgba(255,86,48,.18);
  --warning:#FFD666;--warning-soft:rgba(255,171,0,.16);
  --info:#61F3F3;--info-soft:rgba(0,184,217,.16);
  --success:#77ED8B;--success-soft:rgba(34,197,94,.16);
  --text:#FFFFFF;--text2:#919EAB;--text3:#637381;
  --bg:#161C24;--paper:#212B36;--neutral:#28323D;--canvas:#10141A;
  --card:0 0 2px 0 rgba(0,0,0,.2),0 12px 24px -4px rgba(0,0,0,.16);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --primary:#5BE49B;--primary-dark:#5BE49B;--primary-soft:rgba(91,228,155,.10);--primary-soft2:rgba(91,228,155,.18);
  --secondary:#C684FF;--secondary-soft:rgba(198,132,255,.12);
  --error:#FFAC82;--error-soft:rgba(255,86,48,.18);
  --warning:#FFD666;--warning-soft:rgba(255,171,0,.16);
  --info:#61F3F3;--info-soft:rgba(0,184,217,.16);
  --success:#77ED8B;--success-soft:rgba(34,197,94,.16);
  --text:#FFFFFF;--text2:#919EAB;--text3:#637381;
  --bg:#161C24;--paper:#212B36;--neutral:#28323D;--canvas:#10141A;
  --card:0 0 2px 0 rgba(0,0,0,.2),0 12px 24px -4px rgba(0,0,0,.16);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--text);font:400 14px/1.57 "Public Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Prototype toolbar (not part of the product) ---------- */
.proto{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--divider);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.proto-title{font-weight:700;font-size:13px;margin-right:auto;display:flex;gap:8px;align-items:center}
.proto-title small{font-weight:500;color:var(--text2)}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.seg{display:inline-flex;background:var(--neutral);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--text);box-shadow:var(--z1)}

.stage{padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.device{margin:0 auto;background:var(--bg);border-radius:16px;overflow:hidden;box-shadow:var(--card);max-width:1440px}
.stage.mobile .device{max-width:390px;height:800px;border-radius:36px;border:10px solid #161C24;display:flex;flex-direction:column}
.stage.mobile .app{flex:1;overflow:auto}

/* ---------- App shell ---------- */
.app{container-type:inline-size;background:var(--bg);min-height:640px}
.shell{display:grid;grid-template-columns:280px 1fr;min-height:100%}
.side{border-right:1px dashed var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:4px 8px 20px}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--primary);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
:root[data-theme="dark"] .logo i{color:#161C24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo i{color:#161C24}}
.nav-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);padding:12px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;color:var(--text2);text-decoration:none;font-weight:500;min-height:44px}
.nav a.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav svg{width:22px;height:22px;flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--divider);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);z-index:5}
.scope{display:flex;align-items:center;gap:6px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:transparent;font-size:13px;font-weight:500}
.scope span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope .sep{color:var(--text3)}
.scope b{font-weight:700}
.top .grow{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--text2)}
.iconbtn svg{width:22px;height:22px}
.me{display:flex;align-items:center;gap:10px}
.me .who{line-height:1.25;text-align:right}
.me .who b{display:block;font-size:13px}
.me .who small{color:var(--text2);font-size:12px;white-space:nowrap}
.seg{flex-wrap:wrap}
.proto .ctl{flex-wrap:wrap}

.avatar{border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.av-sm{width:36px;height:36px;font-size:13px;background:var(--secondary-soft);color:var(--secondary)}

.content{padding:24px 40px 48px;max-width:1200px;width:100%;margin:0 auto}
.crumbs{font-size:13px;color:var(--text2);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.crumbs .dot{width:4px;height:4px;border-radius:50%;background:var(--text3);align-self:center}
.crumbs b{color:var(--text);font-weight:500}

/* Person header AP-03 */
.hero{background:var(--paper);border-radius:16px;box-shadow:var(--card);overflow:hidden;margin-bottom:24px}
.hero-band{height:72px;background:linear-gradient(120deg,var(--primary-soft2),var(--secondary-soft))}
.hero-body{display:flex;gap:20px;padding:0 24px 20px;align-items:flex-end;flex-wrap:wrap;margin-top:-36px}
.av-xl{width:96px;height:96px;font-size:32px;background:var(--primary);color:#fff;border:4px solid var(--paper)}
:root[data-theme="dark"] .av-xl{color:#161C24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av-xl{color:#161C24}}
.hero-id{flex:1;min-width:220px;padding-top:40px}
.hero-id h1{margin:0;font-size:24px;line-height:1.3;font-weight:700}
.hero-meta{color:var(--text2);font-size:14px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;line-height:1;white-space:nowrap}
.c-success{background:var(--success-soft);color:var(--success)}
.c-warning{background:var(--warning-soft);color:var(--warning)}
.c-error{background:var(--error-soft);color:var(--error)}
.c-info{background:var(--info-soft);color:var(--info)}
.c-default{background:var(--neutral);color:var(--text2)}
.c-role{background:var(--secondary-soft);color:var(--secondary)}
.c-pending{background:transparent;border:1px solid var(--warning-line);color:var(--warning);font-weight:600}
.c-source{background:var(--info-soft);color:var(--info);font-weight:600}
.chip svg{width:13px;height:13px}

.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:14px;white-space:nowrap}
.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-sm{height:30px;padding:0 10px;font-size:13px}
.btn-ghost{border-color:transparent;color:var(--primary)}
.btn svg{width:18px;height:18px}

/* Tabs */
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--divider);padding:0 24px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:12px 0;color:var(--text2);text-decoration:none;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent}
.tabs a.on{color:var(--text);border-color:var(--text)}

/* Cards */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.span2{grid-column:1/-1}
.card{background:var(--paper);border-radius:16px;box-shadow:var(--card);scroll-margin-top:80px}
.card-h{display:flex;align-items:center;gap:8px;padding:20px 24px 0;flex-wrap:wrap}
.card-h h2{margin:0;font-size:17px;font-weight:700;margin-right:auto}
.card-b{padding:16px 24px 24px}
.why{border:0;background:transparent;color:var(--text2);font-size:12px;font-weight:600;display:inline-flex;gap:4px;align-items:center;padding:4px 6px;border-radius:6px;min-height:32px}
.why:hover{background:var(--neutral)}
.why svg{width:16px;height:16px}
.explain{margin:12px 24px 0;padding:12px 14px;border-radius:10px;background:var(--neutral);font-size:13px}
.explain dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.explain dt{color:var(--text2)}
.explain dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.explain code{font-size:12px;background:var(--paper);padding:1px 5px;border-radius:4px}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
.f{min-width:0}
.f .l{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.f .v{font-weight:500;margin-top:2px;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tier{font-size:10px;font-weight:700;color:var(--text3);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:16px}

.masked{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
.masked svg{width:15px;height:15px}

.noaccess{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px dashed var(--line);border-radius:12px}
.noaccess .ico{width:40px;height:40px;border-radius:12px;background:var(--neutral);display:grid;place-items:center;color:var(--text2);flex:none}
.noaccess .ico svg{width:22px;height:22px}
.noaccess b{display:block}
.noaccess p{margin:2px 0 0;color:var(--text2);font-size:13px}

.addr{display:flex;flex-direction:column;gap:12px}
.addr-row{padding:12px 14px;border-radius:10px;border:1px solid var(--divider)}
.addr-row .l{font-size:12px;color:var(--text2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addr-row .v{font-weight:500;margin-top:2px}

.doc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border-radius:12px;border:1px solid var(--divider);margin-bottom:12px}
.doc .t{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.doc .s{grid-column:1/-1;color:var(--text2);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.logline{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--text2);padding:10px 12px;border-radius:8px;background:var(--info-soft);margin-top:4px}
.logline svg{width:16px;height:16px;color:var(--info);flex:none;margin-top:1px}

/* Timeline AP-05 */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 20px 28px}
.tl li::before{content:"";position:absolute;left:6px;top:20px;bottom:0;width:2px;background:var(--divider)}
.tl li:last-child::before{display:none}
.tl .dotm{position:absolute;left:0;top:5px;width:14px;height:14px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line);background:var(--text3)}
.tl .dotm.cur{background:var(--success);box-shadow:0 0 0 2px var(--success-soft)}
.tl .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.tl .m{color:var(--text2);font-size:13px}

.guard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g{border:1px solid var(--divider);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.g-top{display:flex;gap:12px;align-items:center}
.av-md{width:44px;height:44px;font-size:15px;background:var(--info-soft);color:var(--info)}
.g-top b{display:block}
.g-top small{color:var(--text2)}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.contact{display:flex;flex-direction:column;gap:4px;font-size:13px}
.contact div{display:flex;gap:8px;align-items:center}
.contact svg{width:16px;height:16px;color:var(--text3);flex:none}

.pendcard{border:1px dashed var(--warning-line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:transparent}
.pendcard p{margin:2px 0 0;color:var(--text2);font-size:13px}

.foot{margin-top:24px;font-size:12px;color:var(--text3)}

/* Bottom nav for compact widths */
.bnav{display:none}

/* ---------- Compact layout, driven by frame width ---------- */
@container (max-width: 1080px){
  .shell{grid-template-columns:88px 1fr}
  .side .logo span,.nav-h,.nav a span{display:none}
  .nav a{justify-content:center;padding:10px}
  .content{padding:24px 24px 48px}
}
@container (max-width: 860px){
  .grid,.guard{grid-template-columns:minmax(0,1fr)}
  .me .who{display:none}
}
@container (max-width: 640px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:0 12px;height:56px}
  .scope .hide-sm{display:none}
  .content{padding:16px 16px 96px}
  .hero-body{padding:0 16px 16px;gap:12px}
  .av-xl{width:72px;height:72px;font-size:24px}
  .hero-id{padding-top:0;min-width:100%}
  .hero-id h1{font-size:20px}
  .hero-actions{width:100%}
  .hero-actions .btn{flex:1;justify-content:center}
  .tabs{padding:0 16px;gap:20px}
  .card-h{padding:16px 16px 0}
  .card-b{padding:12px 16px 16px}
  .explain{margin:12px 16px 0}
  .fields{grid-template-columns:minmax(0,1fr)}
  .crumbs{display:none}
  .bnav{display:flex;position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--divider);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--text2);text-decoration:none;min-width:64px;min-height:44px;justify-content:center}
  .bnav a.on{color:var(--primary)}
  .bnav svg{width:22px;height:22px}
}

/* Dialog */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:50}
.dlg{background:var(--paper);border-radius:16px;box-shadow:0 24px 48px rgba(0,0,0,.24);width:100%;max-width:480px;padding:24px}
.dlg h3{margin:0 0 4px;font-size:18px}
.dlg p{margin:0 0 16px;color:var(--text2);font-size:13px}
.dlg label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin:12px 0 6px}
.dlg select,.dlg textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.dlg textarea{min-height:72px;resize:vertical}
.dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.dlg .btn-primary:disabled{opacity:.4;cursor:not-allowed}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:60;max-width:calc(100% - 32px)}

.content a:not(.btn):not(.tabs a){color:var(--primary-dark);font-weight:600;text-decoration:none}
.content a:not(.btn):not(.tabs a):hover{text-decoration:underline}
.page-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{margin:0;font-size:24px;font-weight:700;line-height:1.3}
.page-h p{margin:2px 0 0;color:var(--text2)}
.page-h .grow{flex:1}
.listcard{background:var(--paper);border-radius:16px;box-shadow:var(--card);overflow:hidden}
.qtabs{display:flex;gap:24px;padding:0 20px;border-bottom:1px solid var(--divider);overflow-x:auto;scrollbar-width:none}
.qtabs button{border:0;background:transparent;padding:12px 0;font-weight:600;color:var(--text2);white-space:nowrap;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center;min-height:44px}
.qtabs button[aria-pressed="true"]{color:var(--text);border-color:var(--text)}
.cnt{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--neutral);color:var(--text2)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:600;color:var(--text2);background:var(--neutral);padding:12px 16px;white-space:nowrap}
td{padding:14px 16px;border-bottom:1px dashed var(--divider);vertical-align:middle}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--primary-soft)}
.sub{color:var(--text2);font-size:12px}
.whoc{display:flex;gap:12px;align-items:center;min-width:0}
.whoc b{display:block;font-weight:600;white-space:nowrap}
.av-row{width:40px;height:40px;font-size:13px;background:var(--primary-soft2);color:var(--primary-dark)}
.scopebar{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;background:var(--neutral);font-size:13px;margin:16px 20px}
.scopebar svg{width:16px;height:16px;color:var(--text2);flex:none;margin-top:2px}

/* Board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:16px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--neutral);border-radius:16px;padding:12px;min-height:200px;display:flex;flex-direction:column;gap:10px}
.col-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:2px 4px}
.kcard{background:var(--paper);border-radius:12px;box-shadow:var(--z1);padding:12px;border:1px solid var(--divider);text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.kcard:hover{border-color:var(--primary)}
.kcard b{font-size:14px}
.kcard .blk{font-size:12px;color:var(--warning);display:flex;gap:4px;align-items:flex-start}
.kcard .blk svg{width:14px;height:14px;flex:none;margin-top:2px}
.kempty{font-size:12px;color:var(--text3);padding:8px 4px}

/* Stepper */
.steps{display:flex;gap:0;padding:16px 24px 20px;overflow-x:auto;scrollbar-width:none}
.step{flex:1;min-width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:12px;color:var(--text2);text-align:center}
.step::before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--divider)}
.step:first-child::before{display:none}
.step .d{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--neutral);color:var(--text2);font-weight:700;font-size:11px;position:relative;z-index:1}
.step.done .d{background:var(--success);color:#fff}
.step.done::before,.step.cur::before{background:var(--success)}
.step.cur .d{background:var(--text);color:var(--bg)}
.step.cur{color:var(--text);font-weight:700}
.step.bad .d{background:var(--error);color:#fff}

/* Capacity bar */
.bar{height:8px;border-radius:4px;background:var(--neutral);overflow:hidden;display:flex;min-width:120px}
.bar i{display:block;height:100%}
.bar .e{background:var(--primary)}
.bar .h{background:var(--warning-line)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.kv{display:grid;grid-template-columns:200px 1fr;gap:10px 16px;font-size:14px}
.kv dt{color:var(--text2)}
.kv dd{margin:0;font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notset{color:var(--warning);font-weight:700;display:inline-flex;gap:4px;align-items:center}
.notset svg{width:15px;height:15px}
.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.count{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--warning-soft);color:var(--warning);font-weight:600;font-size:13px}
.count svg{width:20px;height:20px;flex:none}
.blocked{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid var(--warning-line);font-size:13px}
.blocked svg{width:20px;height:20px;color:var(--warning);flex:none}
.blocked b{display:block}
.list-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--divider);flex-wrap:wrap}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:160px}
.pos{width:28px;height:28px;border-radius:8px;background:var(--neutral);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.dlg input[type=text]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.drawer-kids{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.drawer-kids div{padding:10px 12px;border:1px solid var(--divider);border-radius:10px}
@container (max-width: 860px){.settings{grid-template-columns:minmax(0,1fr)}.kv{grid-template-columns:minmax(0,1fr);gap:2px 0}.kv dd{margin-bottom:10px}}
@container (max-width: 640px){.page-h h1{font-size:20px}.steps{padding:12px 16px 16px}.board{grid-auto-columns:minmax(240px,80%)}}

  if(t.hasAttribute('data-close')||t.matches('[data-scrim]')){close();return;}
  if(t.closest('#viewers')){V=t.dataset.v;document.querySelectorAll('#viewers button').forEach(b=>b.setAttribute('aria-pressed',b===t));render();return;}
  if(t.closest('#theme')){const m=t.dataset.t;document.querySelectorAll('#theme button').forEach(b=>b.setAttribute('aria-pressed',b===t));if(m==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',m);return;}
  if(t.dataset.enqtab){enqTab=t.dataset.enqtab;render();return;}
  if(t.dataset.closed){showClosed=t.dataset.closed==='1';render();return;}
  if(t.dataset.apptab){e.preventDefault();appTab=t.dataset.apptab;render();return;}
  if(t.dataset.enq){enqDialog(t.dataset.enq);return;}
  if(t.dataset.app&&!t.dataset.act){appTab='overview';location.hash='app/'+t.dataset.app;return;}
  const a=t.dataset.no&&APPS.find(x=>x.no===t.dataset.no);
  switch(t.dataset.act){
    case 'offer':offerFlow(t.dataset.no);break;
    case 'doofer':makeOffer(a,false);close();toast('Offer issued. Student ID '+a.sid+' created.');render();break;
    case 'override':makeOffer(a,true);close();toast('Offer issued over the limit (buffer). Reason recorded.');render();break;
    case 'toprincipal':pendingPrincipal={no:a.no,name:a.name,grade:a.grade,reason:document.getElementById('rs').value};close();toast('Sent to Dr Anita Rao for approval.');render();break;
    case 'papprove':{const x=APPS.find(y=>y.no===pendingPrincipal.no);makeOffer(x,true);pendingPrincipal=null;toast('Approved. Offer issued to '+x.name+'.');render();break;}
    case 'decide':dialog(`<h3>Decision for ${esc(a.name)}</h3><p>Who decides an application is pending (OQ-66).</p><label>Decision</label><select><option>Waitlist</option><option>Reject</option></select><label>Reason (required for Reject)</label><textarea></textarea><div class="row"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-close>Save decision</button></div>`);break;
    case 'remind':toast('Reminder sent to '+a.contact.split(' (')[0]+' for missing documents.');break;
    case 'acceptdoc':a.docs.find(d=>d.t===t.dataset.doc).s='ACCEPTED';if(a.docs.every(d=>d.s==='ACCEPTED')){a.st='ASSESSMENT';a.block='Schedule entrance test';}toast(t.dataset.doc+' accepted.');render();break;
    case 'reveal':dialog(`<h3>Reveal restricted document?</h3><p>This view is recorded with your name and the time.</p><label>Purpose</label><select><option>Verify identity for admission</option><option>Student Pass application</option></select><div class="row"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-close>Reveal</button></div>`);break;
    case 'accept':a.offer.st='ACCEPTED';a.st='ACCEPTED';a.block='Contract and registration fee';toast('Acceptance recorded. Next: contract and registration fee.');render();break;
    case 'rescind':dialog(`<h3>Rescind offer?</h3><p>The enrolment becomes Cancelled and the seat is released. Nothing is deleted.</p><label>Reason (required)</label><textarea></textarea><div class="row"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-close>Rescind</button></div>`);break;
    case 'enrol':{const ok=a.approval&&a.approval.st==='APPROVED'&&!(a.contract&&a.contract.st==='IN_COOLING_OFF');dialog(ok?`<h3>Complete enrolment</h3><p>Assign a class, then the student gets a timetable, bus route and logins.</p><div class="row"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-close>Continue</button></div>`:`<h3>Not ready to enrol</h3><div class="blocked">${I.warn}<span><b>Waiting on</b>${a.approval&&a.approval.st!=='APPROVED'?'ICA decision on the Student Pass. ':''}${a.contract&&a.contract.st==='IN_COOLING_OFF'?'Cooling-off ends '+a.contract.ends+'.':''}</span></div><div class="row"><button class="btn" data-close>Close</button></div>`);break;}
    case 'apr':a.approval.st=t.dataset.r;a.approval.dec='12 Nov 2026';if(t.dataset.r==='REJECTED'){a.closed=true;a.enr='CANCELLED';a.contract.st='TERMINATED';a.fees.forEach(f=>f[1]='REFUNDED');a.block='Student Pass rejected';}else a.block='Cooling-off ends '+a.contract.ends;toast('ICA decision recorded.');render();break;
    case 'contract':toast('Prepare contract opens the contract template for this campus.');break;
    case 'match':a.match=false;toast('Confirmed: Neha Sharma reused as guardian. No duplicate created.');render();break;
    case 'startapp':close();toast('Draft application started for '+t.dataset.kid+'.');break;
    case 'newenq':toast('New enquiry form opens here.');break;
    case 'editset':toast('Settings editor opens here.');break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.matches('tr[data-enq],tr[data-app]'))e.target.click();});

function render(){
  const h=location.hash.slice(1)||'pipeline';
  const [r,arg]=h.split('/');
  const route=r==='app'?'pipeline':r;
  shell(route);
  const v=document.getElementById('view');
  v.innerHTML=r==='enquiries'?vEnquiries():r==='capacity'?vCapacity():r==='settings'?vSettings():r==='app'?vApp(arg):vPipeline();
}
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#app/'))appTab='overview';render();window.scrollTo(0,0);});
render();
})();
</script>
</body></html>
