    profile:[`student.profile.view`,'Capability from template'],
    address:can('student.address.view')?[`student.address.view`,'Capability from template']:[`student.address.view`,'Not held: field group hidden'],
    identity:v.t3?[`student.identity.reveal`,'Tier 3 type grant A17: Admissions Officers, student identity, SMART Campus Punggol (DL-36)']:[`student.identity.reveal`,'Not held, and no A17 grant or A15 record ACL'],
    enrolment:[`student.enrolment.view`,'Capability from template'],
    guardians:[`student.guardian.view · student.guardian_contact.view`,'Capability from template']
  }[key];
  let extra='';
  if(key==='identity'&&v.t3) extra=`<dt>A17 approver</dt><dd>${pend('OQ-47')}</dd>`;

}

/* ---------- Reveal dialog (AP-06 + AP-10), no browser dialogs ---------- */
function openReveal(key){
  const layer=document.getElementById('layer');
  const what=key==='nat'?'nationality and immigration status':S.docs[+key.slice(3)].type;
  layer.innerHTML=`<div class="scrim" data-close><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <h3 id="dlgT">Reveal ${what}</h3>
    <p>This is Tier 3 data. Choose a purpose. The read is logged to the audit trail with your name, the purpose and the time.</p>
    <label for="dlgP">Purpose ${pend('OQ-09','catalogue')}</label>
    <select id="dlgP"><option value="">Choose a purpose</option><option>Verify a document for enrolment</option><option>Renew or check a pass</option><option>Respond to an authority request</option><option>Other (explain below)</option></select>
    <label for="dlgN">Note (optional)</label>
    <textarea id="dlgN" placeholder="For example: Student Pass renewal, ICA letter of 4 Nov"></textarea>
    <div class="row"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="dlgOk" disabled>Reveal and log</button></div>
  </div></div>`;
  const sel=document.getElementById('dlgP'),ok=document.getElementById('dlgOk');
  sel.focus();
  sel.addEventListener('change',()=>{ok.disabled=!sel.value});
  ok.addEventListener('click',()=>{
    revealed[key]=true;
    revealed._log=`Read logged to audit (OBJ-11) · Lina Goh · ${sel.value} · 6 Nov 2026, 10:42. Hidden again when you leave this page.`;
    layer.innerHTML='';render();
  });
  layer.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)layer.innerHTML=''}));
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('layer').innerHTML=''});

let tt;
function toast(t){
  const layer=document.getElementById('layer');
  const d=document.createElement('div');d.className='toast';d.textContent='Prototype: '+t;
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  document.body.appendChild(d);clearTimeout(tt);tt=setTimeout(()=>d.remove(),2400);
}

document.getElementById('app').addEventListener('click',e=>{
  const w=e.target.closest('[data-why]');if(w){open[w.dataset.why]=!open[w.dataset.why];render();return;}
  const r=e.target.closest('[data-reveal]');if(r){openReveal(r.dataset.reveal);return;}
  const m=e.target.closest('[data-mask]');if(m){revealed[m.dataset.mask]=false;render();return;}
  const p=e.target.closest('[data-proto]');if(p){e.preventDefault();toast(p.dataset.proto);return;}
  const a=e.target.closest('.tabs a');if(a){e.preventDefault();document.querySelectorAll('.tabs a').forEach(x=>x.classList.toggle('on',x===a));const s=document.querySelector(a.getAttribute('href'));if(s)s.scrollIntoView({behavior:'smooth',block:'start'});}
});

function seg(id,attr,fn){
  const g=document.getElementById(id);
  g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset[attr]);});
}
seg('segViewer','v',v=>{viewer=v;for(const k in revealed)delete revealed[k];for(const k in open)delete open[k];render();});
seg('segFrame','f',f=>{document.getElementById('stage').classList.toggle('mobile',f==='mobile');});
seg('segTheme','t',t=>{if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);});

render();
})();
</script>
